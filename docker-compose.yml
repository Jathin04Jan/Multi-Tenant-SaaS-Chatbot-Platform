services:
  postgres:
    image: postgres:15-alpine
    container_name: yourbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yourbot_user
      POSTGRES_PASSWORD: yourbot_password
      POSTGRES_DB: yourbot_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourbot_user -d yourbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yourbot_network

  minio:
    image: minio/minio:latest
    container_name: yourbot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yourbot_minio_admin
      MINIO_ROOT_PASSWORD: yourbot_minio_password
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - yourbot_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  yourbot_network:
    driver: bridge

