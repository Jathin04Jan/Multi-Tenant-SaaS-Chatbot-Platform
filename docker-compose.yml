services:
  postgres:
    image: postgres:15-alpine
    container_name: yourbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yourbot_user
      POSTGRES_PASSWORD: yourbot_password
      POSTGRES_DB: yourbot_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourbot_user -d yourbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yourbot_network

  minio:
    image: minio/minio:latest
    container_name: yourbot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yourbot_minio_admin
      MINIO_ROOT_PASSWORD: yourbot_minio_password
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - yourbot_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yourbot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yourbot.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"  # pgAdmin web interface
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - yourbot_network
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant:latest
    container_name: yourbot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # Qdrant REST API
      - "6334:6334"  # Qdrant gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - yourbot_network

  redis:
    image: redis:7-alpine
    container_name: yourbot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Redis port
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yourbot_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: yourbot_redis_commander
    platform: linux/amd64  # Explicitly specify platform to avoid warning
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    ports:
      - "8081:8081"  # Redis Commander web interface
    networks:
      - yourbot_network
    depends_on:
      - redis

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local

networks:
  yourbot_network:
    driver: bridge

